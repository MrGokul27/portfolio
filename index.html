<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Frontend Developer Portfolio | Modern Web Interfaces &amp; React.js
    </title>
    <meta
      name="description"
      content="Portfolio of a Frontend Developer building modern, responsive, and user-friendly web applications using HTML5, CSS3, Bootstrap, JavaScript (ES6+), and React.js."
    />
    <meta
      name="keywords"
      content="Frontend Developer, React.js Developer, Web Developer, HTML5, CSS3, Bootstrap, JavaScript ES6+, Portfolio"
    />
    <meta name="author" content="Frontend Developer" />
    <meta property="og:title" content="Frontend Developer Portfolio" />
    <meta
      property="og:description"
      content="Modern, responsive web applications crafted with HTML5, CSS3, Bootstrap, JavaScript (ES6+), and React.js."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B0F19" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-bs-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
